version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: src/IntegrationPlatform.Api/Dockerfile
    container_name: integration-platform-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Data Source=/data/integration.db
    volumes:
      - sqlite-data:/data
    depends_on:
      - worker

  worker:
    build:
      context: .
      dockerfile: src/IntegrationPlatform.Worker/Dockerfile
    container_name: integration-platform-worker
    environment:
      - DOTNET_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Data Source=/data/integration.db
    volumes:
      - sqlite-data:/data

volumes:
  sqlite-data:
